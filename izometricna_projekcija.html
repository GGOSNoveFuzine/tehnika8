<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12323d">
<title>Izometrična projekcija</title>
<style>*{box-sizing:border-box}
:root{color-scheme:light;--ink:#172e3c;--muted:#526a73;--line:#cbd8d9;--teal:#086c70;--teal-deep:#004d53;--tint:#e4f2ef;--accent:#a95413;--red:#ba1836;--nav:#142f3a;--learn-size:clamp(22px,min(2.92vw,5.2vh),62px);font-family:Inter,Aptos,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#edf2f1}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);font-size:16px}
button,select,input{font:inherit;color:inherit}
button,select,input[type=text],input[type=number]{border:1px solid #b6c8ca;border-radius:7px;background:white;min-height:44px}
button{font-size:.9rem;font-weight:620;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.15}
button:hover:not(:disabled),select:hover{border-color:var(--teal);background:#eff7f5}
button:focus-visible,select:focus-visible,input:focus-visible,svg:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid #d7843e;outline-offset:2px}
button:disabled{opacity:.43;cursor:default}
button.on,button[aria-pressed=true]{background:var(--tint);color:#065458;border-color:#409693}
button.primary{background:var(--teal);color:white;border-color:var(--teal);padding-inline:20px}
button.primary:hover:not(:disabled){background:var(--teal-deep);color:white}
button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden],.pane-tools:empty,.readout:empty{display:none!important}
.mast{padding:0 clamp(12px,2.1vw,40px);background:var(--nav);color:white;display:flex;align-items:center;gap:clamp(18px,4vw,78px);min-height:62px}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand>svg{width:33px;height:37px;color:#f3fffc}.brand h1{font-weight:630;letter-spacing:-.045em;font-size:clamp(20px,1.58vw,32px);margin:0}
.mast nav,.utility,#modes{display:flex;align-items:stretch;gap:4px}.mast button{color:#e4eff0;background:transparent;border:0;border-radius:0}.mast nav button{position:relative;padding:0 clamp(12px,1.1vw,21px);height:62px;letter-spacing:.01em;font-weight:580;font-size:1rem}
.mast nav .on{color:#fff}.mast nav .on:after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:3px;background:#79d4c5;border-radius:3px}.mast button:hover:not(:disabled){background:#294854;color:white}
.utility{margin-left:auto;gap:5px}.utility button,.icon{min-width:44px;padding:7px}.utility button{height:44px;border-radius:6px;font-size:1.15rem}.utility button svg{width:21px;height:21px}
#app{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.subbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f7faf9;padding:8px clamp(12px,1.7vw,32px);border-bottom:1px solid var(--line)}
#modes{gap:3px;flex-wrap:wrap}#modes button{background:transparent;border-color:transparent;color:var(--muted);font-weight:580}#modes button[aria-pressed=true]{background:#dcece9;color:#064e53}
select{padding:6px 30px 6px 12px;max-width:100%;font-weight:630}#choice{display:flex;gap:8px;align-items:center;min-width:0}#choice select{width:clamp(190px,26vw,510px)}
#panes{display:grid;grid-template-columns:minmax(0,var(--ref,43fr)) minmax(0,var(--task,57fr));min-height:0;padding:clamp(7px,1vw,18px);gap:clamp(7px,1vw,16px);position:relative}
#app[data-mode=learn] #panes{--ref:30fr;--task:70fr}#app[data-mode=axes] #panes,#app[data-mode=quiz] #panes{--ref:36fr;--task:64fr}#app[data-mode=free] #panes{--ref:32fr;--task:68fr}
.pane{position:relative;display:flex;flex-flow:column nowrap;min-height:0;min-width:0;overflow:hidden;background:#fff;border:1px solid #c4d2d3;border-radius:12px;box-shadow:0 2px 7px #153a4610}
.pane-head,.pane-tools,.readout{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:8px clamp(10px,1.25vw,24px)}
.pane-head{min-height:54px;border-bottom:1px solid #e2eaea;background:#fcfdfc;gap:12px}
.pane-head h2{margin:0;font-size:clamp(16px,1.15vw,24px);font-weight:650;letter-spacing:-.02em}.unit{color:var(--muted);font-size:clamp(13px,.92vw,17px);margin-left:auto}
.pane-head button{background:transparent;border-color:transparent;color:#46646c}.surface{min-height:0;min-width:0;flex:1;position:relative}.surface>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.pane-tools{flex-wrap:wrap;background:#f9fbfa;border-top:1px solid #dce6e5}.pane-tools select{font-size:.9rem}.readout{line-height:1.1;color:#153746;border-top:1px solid #e3ebe9;font-weight:575;letter-spacing:-.035em;font-size:var(--learn-size);font-variant-numeric:tabular-nums;padding-block:10px;overflow-wrap:anywhere}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-top:1px solid var(--line);padding:8px clamp(12px,1.7vw,32px);min-height:62px}
#commands{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:flex-end}#status{flex:1;min-width:0;line-height:1.26;font-size:clamp(14px,1.22vw,23px);color:#365461}#status.step{font-size:var(--learn-size);line-height:1.06;font-weight:590;letter-spacing:-.035em;color:var(--ink)}#status.error{color:#97324b}#status.good{color:#00675a}
.swatch{width:21px;height:0;border-top:3px solid currentColor}.swatch.hidden{border-top-style:dashed}.swatch.construction{border-top-width:1px}.swatch.arc{height:10px;border:2px solid currentColor;border-bottom:0;border-radius:17px 17px 0 0}.icon-btn{padding:8px 12px}
#mobileRef{display:none}#app.ref-open #panes{display:flex}#app.ref-open #reference{width:100%}#app.ref-open #work{display:none}
dialog{color:var(--ink);width:min(550px,calc(100vw - 24px));max-height:88dvh;border:1px solid #b9cacc;border-radius:14px;padding:0;box-shadow:0 16px 54px #1233403b}
dialog::backdrop{background:#122f3e66}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:1.25rem;margin:0}.dialog-head button{min-width:44px;background:#f2f7f6;border:0}#dialogBody{padding:16px 18px 22px}#dialogBody p{line-height:1.5;margin:0 0 14px}.fields{display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:.94rem;font-weight:600}.fields label.check{display:flex;align-items:center}.fields input{width:100%;padding:6px 10px}.fields input[type=checkbox]{width:18px;height:18px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.fields nav{display:grid;gap:4px}.fields nav button{justify-content:flex-start}.fields output{color:#91411d}.steps-list{max-height:52vh;overflow:auto}.dimlist{width:100%;border-collapse:collapse}.dimlist td,.dimlist th{padding:6px;text-align:left;border-bottom:1px solid #dce6e5}
svg text{font-family:inherit;fill:var(--ink);user-select:none}.edge,.visible-edge,.preview-edge,.construction-line,.current-line,.construction-guide,.dimension-line,.guide-line,.axis-line,.grid-line,.ref-grid,.draw-paper-grid,.draw-paper-grid-z,.draw-user-visible,.draw-user-hidden,.draw-user-helper,.hidden-edge,.profile-rubber,.solution,.dim-line,.ext-line,.assemble-dim,.assemble-dim-ext,.preview-hidden{fill:none;stroke-linejoin:round}
.edge,.visible-edge,.preview-edge,.draw-user-visible,.draw-user-hidden,.hidden-edge,.preview-hidden{stroke:var(--ink);stroke-width:2.7}
.guide-line,.axis-line{stroke:#77919b;stroke-width:1.6}.grid-line,.draw-paper-grid,.draw-paper-grid-z{stroke:#dce6e7;stroke-width:1}.grid-dot{fill:#b5c9cb}.construction-line,.construction-guide,.ref-grid,.draw-user-helper{stroke:#77a3b4;stroke-width:1.5}.current-line{stroke:var(--accent);stroke-width:3.5}.dimension-line,.dim-line,.assemble-dim{stroke:#527782;stroke-width:1.35}.ext-line,.assemble-dim-ext{stroke:#79949c;stroke-width:1}.profile-rubber{stroke:#087c80;stroke-width:2.4}.solution{stroke:var(--red);stroke-width:3}.solution.helper{stroke-width:1.6}.point,.point-current{stroke:white;stroke-width:1.5;fill:#294b5a}.point-current,.start{fill:var(--accent)}.point-pick{fill:#086c70;stroke:white;stroke-width:2}
.tech-label,.tech-small,.tech-dim,.start-label,.axis-label,.dim-text,.assemble-dim-text,.quiz-letter{font-weight:600;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}.axis-label,.dim-text,.start-label,.quiz-letter,.assemble-dim-text{font-size:var(--label-px,30px)}.tech-label{font-size:var(--guide-label,26px)}.tech-small{font-size:17px}.tech-dim{font-size:25px;fill:#2d6371}.dim-text,.assemble-dim-text{fill:#214956}.start-label{fill:var(--accent)}.assemble-dim-mask{fill:white}.face-top{fill:#dcebe6}.face-x{fill:#a4c2ca}.face-y{fill:#c4d8dc}.face-cut{fill:#b6d2c9}
svg .overlay{pointer-events:none}svg [data-cell],svg [data-choice],svg [data-map-axis],svg [data-vertex],svg [data-dim]{cursor:pointer}#refSvg.orbit{cursor:grab}#refSvg.orbit:active{cursor:grabbing}
@media(max-width:1000px){.mast{gap:18px}.pane-tools button{padding-inline:8px}.subbar{padding-inline:9px}.pane-tools{gap:4px}.readout{padding-block:7px}}
@media(max-width:760px){:root{--learn-size:clamp(23px,5.6vw,33px)}.mast{min-height:0;gap:3px;display:grid;grid-template-columns:1fr auto;padding:4px 10px 0}.brand{gap:7px}.brand h1{font-size:20px}.brand>svg{width:24px;height:27px}.mast nav{grid-row:2;grid-column:1/-1;justify-content:stretch}.mast nav button{flex:1;height:44px;min-height:44px}.utility{grid-row:1;grid-column:2}.utility button{width:38px;min-width:38px}
.subbar{flex-wrap:wrap;gap:3px;padding:3px 6px}#modes{flex:1 1 100%;gap:1px;flex-wrap:nowrap}#modes button{flex:1;padding:4px;font-size:13px}#choice{width:100%}#choice select{width:100%;font-size:15px;min-height:44px}#panes{display:flex;padding:5px;gap:0}.pane{width:100%;border-radius:9px}#reference{display:none}#app.ref-open #reference{display:flex}#mobileRef{display:inline-flex}#workTitle{flex:1}.unit{font-size:13px}.pane-head{min-height:44px;padding:1px 7px;gap:5px}.pane-head button{padding:4px 7px}.pane-tools{padding:4px;gap:3px}.pane-tools button{font-size:12px;padding-inline:7px}.swatch{width:15px}footer{flex-wrap:wrap;gap:4px;padding:5px 7px}#status{flex:1 1 100%;font-size:13px}#commands{justify-content:flex-start;gap:4px}#commands button{padding-inline:9px;font-size:13px}.readout{font-size:var(--learn-size)}}
@media(max-height:540px) and (min-width:761px){.mast,.mast nav button{height:44px;min-height:44px}.subbar,.pane-head,.pane-tools,footer{padding-block:2px;min-height:44px}#panes{padding:4px;gap:4px}}
@media(max-height:540px) and (max-width:760px){body{height:auto;min-height:100dvh}#panes{min-height:355px}}
@media(prefers-reduced-motion:no-preference){.replay .current-line,.replay .point-current,.replay .replay-edge{animation:pulse .85s ease-out}@keyframes pulse{from{opacity:.12}to{opacity:1}}}


#mainSvg .measured-label,#mainSvg .angle-label{font-size:var(--guide-label,25px)}
#mainSvg .measured-label{fill:#265966}
@media(min-width:761px){#app:is([data-mode=profile],[data-mode=orbit],[data-mode=copy]) #workUnit{font-size:var(--learn-size);line-height:1.06;font-weight:540;letter-spacing:-.035em}}
@media(max-width:760px){
  body,#app{grid-template-columns:minmax(0,1fr)}
  .mast{grid-template-columns:minmax(0,1fr) auto}
  .brand{min-width:0;white-space:normal}.brand>svg{flex:none}
  .brand h1{line-height:1.05}
  .utility button{min-width:44px;width:44px}
  #modes,#modes button,#choice select{min-width:0}
}


.angle-label{font-weight:600;fill:#195762;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}
.active-end{fill:#fff;fill-opacity:.75;stroke:#ad5918;stroke-width:3;pointer-events:none}
.hint-info{width:100%;font-size:var(--learn-size);line-height:1.06;font-weight:550;color:#235d60}
.hint-edge{stroke:#b15210;stroke-width:4.5;stroke-linecap:round}
.hint-dot{fill:#fff;stroke:#ad5918;stroke-width:3}
.hint-hit{stroke:transparent;stroke-width:26;cursor:pointer;pointer-events:stroke}
.hint-hit:focus-visible{stroke:#b1521066;outline:none}
.outline-edge,.outline-error{fill:none;stroke-width:2.8;stroke-linecap:round}.outline-edge{stroke:var(--ink)}.outline-error{stroke:var(--red);stroke-width:3.5}
.cube-division{stroke:#537479;stroke-width:1.45;fill:none;stroke-linecap:butt;pointer-events:none}
.lesson-stroke{fill:none;stroke:#547889;stroke-width:1.9;stroke-linecap:round}.lesson-tick{stroke:#849ca1;stroke-width:1.25}
.lesson-measure-tick{stroke:#754222;stroke-width:1.65}.lesson-mark{fill:#557e83}
.current-guide{fill:none;stroke:#a96530;stroke-width:2}.lesson-measure-label{font-weight:650;fill:#235765;paint-order:stroke;stroke:white;stroke-width:5;stroke-linejoin:round}
@media(prefers-reduced-motion:no-preference){.replay .current-guide,.replay .lesson-measure-label{animation:pulse .85s ease-out}}
#work[data-verdict] .pane-head{background:#fff1cf;color:#623d00;border-bottom:3px solid #ac7519}
#work[data-verdict="correct"] .pane-head{background:#17623b;color:white;border-color:#10482b}
#work[data-verdict] .pane-head h2{font-size:clamp(21px,2.6vw,42px);font-weight:750;line-height:1.15}
#work[data-verdict] .pane-head .unit,#work[data-verdict] .pane-head button{color:inherit}
</style>
</head>
<body>
<header class="mast">
  <div class="brand"><svg viewBox="0 0 36 38" aria-hidden="true"><path d="M18 2 33 10.6v16.8L18 36 3 27.4V10.6Z M3 10.6 18 19l15-8.4 M18 19v17" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10.6 6.3 15 8.5v8.5" fill="none" stroke="#6ed0bf" stroke-width="2"/></svg><h1>Izometrična projekcija</h1></div>
  <nav id="areas" aria-label="Glavne dejavnosti"><button data-area="learn">Nauči se</button><button data-area="draw">Riši</button><button data-area="create">Ustvari</button></nav>
  <div class="utility"><button id="homework" title="Domača naloga" aria-label="Domača naloga"></button><button id="help" title="Navodila za to dejavnost" aria-label="Navodila za to dejavnost">?</button><button id="fullscreen" title="Cel zaslon" aria-label="Cel zaslon"></button></div>
</header>
<main id="app">
  <div class="subbar"><nav id="modes" aria-label="Vrsta dejavnosti"></nav><div id="choice"></div></div>
  <div id="panes">
    <section class="pane" id="reference">
      <header class="pane-head"><h2 id="refTitle"></h2><span class="unit" id="refUnit"></span><button class="icon" id="expandRef" title="Povečaj predlogo" aria-label="Povečaj predlogo"></button></header>
      <div class="surface" id="refSurface"><svg id="refSvg" role="img" aria-label="Predloga"></svg></div>
      <div class="pane-tools" id="refTools"></div><div class="readout" id="refReadout"></div>
    </section>
    <section class="pane" id="work">
      <header class="pane-head"><h2 id="workTitle"></h2><span class="unit" id="workUnit"></span><button id="mobileRef">Predloga</button></header>
      <div class="surface" id="workSurface"><svg id="mainSvg" aria-describedby="status" aria-label="Delovna površina" tabindex="0"></svg></div>
      <div class="pane-tools" id="workTools"></div>
    </section>
  </div>
  <footer><div id="status" role="status" aria-live="polite"></div><div id="commands"></div></footer>
</main>
<dialog id="panelDialog"><form method="dialog" class="dialog-head"><h2 id="dialogTitle"></h2><button aria-label="Zapri">✕</button></form><div id="dialogBody"></div></dialog>
<script>
(() => {
"use strict";
const NS="http://www.w3.org/2000/svg";
const COS30=Math.cos(Math.PI/6), SIN30=.5, VIEW=[1,1,1];
const C={ink:"#172e3c",accent:"#086c70",warm:"#a95413",guide:"#82999e",construction:"#7197a3"};
const $=id=>document.getElementById(id);
const mainSvg=$("mainSvg"),refSvg=$("refSvg"),app=$("app");
const route={mode:"axes",id:"demo",pose:0};
const state={axisStep:0,axisMode:"demo",axisChoice:null,axisChoiceVariant:0,axisChoiceCorrect:0,axisMap:{x:null,y:null,z:null},lessonId:"cuboid",lessonStep:0,lessonGrid:true};
let axisTimer=null, refExpanded=false, message="", messageType="";
const modeNames={axes:"Osi",learn:"Vodeni primeri",quiz:"Vrste črt",profile:"Iz kotiranega narisa",copy:"Po izometrični predlogi",orbit:"Po vrtljivem telesu",assemble:"Sestavi po predlogi",free:"Moj model",editor:"Moj naris"};
const areas={learn:["axes","learn","quiz"],draw:["profile","copy","orbit"],create:["assemble","free","editor"]};
function areaOf(mode){return Object.keys(areas).find(area=>areas[area].includes(mode))}
function isDrawing(){return areas.draw.includes(route.mode)}
function isBuilding(){return ["assemble","free"].includes(route.mode)}
function htmlEl(tag,attrs={},text=""){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){if(v!==null&&v!==undefined)n.setAttribute(k,v)}
  if(text)n.textContent=text;
  return n;
}
function setFeedback(text="",kind=""){
  message=text;messageType=kind;showStatus();
}
function eventPoint(svg,event){
  const m=svg.getScreenCTM();
  if(!m)return [0,0];
  const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;
  const q=p.matrixTransform(m.inverse());return [q.x,q.y];
}
function viewport(svg){
  const r=svg.getBoundingClientRect();
  const w=Math.max(1,r.width),h=Math.max(1,r.height);
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  return {w,h};
}
function unitFont(){
  return Math.max(22,Math.min(62,innerWidth*.0292,innerHeight*.052));
}
function svgBox(svg,w,h,x=0,y=0){svg.setAttribute("viewBox",[x,y,w,h].join(" "))}
function shortTitle(lesson){const s=lesson.title.replace(/^\d+\s*·\s*/,"").toLocaleLowerCase("sl");return s.charAt(0).toUpperCase()+s.slice(1)}
function copy(value){return JSON.parse(JSON.stringify(value))}
const clipModes=["visible","hidden","construction","delete"];
const icons={
  fullscreen:"M8 3H3v5 M16 3h5v5 M21 16v5h-5 M3 16v5h5",
  shrink:"M3 8h5V3 M16 3v5h5 M21 16h-5v5 M8 21v-5H3",
  share:"M9.5 14.5l5-5 M8.5 16.5 7 18a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0 M15.5 7.5 17 6a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0",
  undo:"M9 5 3 10l6 5 M4 10h10c4 0 6 2 6 6v3",
  trash:"M3 6h18 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7",
  back:"M14 5l-7 7 7 7",next:"M9 5l7 7-7 7",plus:"M12 4v16 M4 12h16",minus:"M4 12h16",
  repeat:"M3 5v6h6 M4 11a8 8 0 1 1 1 7",check:"M4 12l5 5L20 6",rotate:"M3 10a9 9 0 0 1 15-5l2 2 M20 3v5h-5 M21 14a9 9 0 0 1-15 5l-2-2 M4 21v-5h5",
  grid:"M3 8h18 M3 16h18 M8 3v18 M16 3v18",edit:"m4 16-1 5 5-1L20 8l-4-4z M14 6l4 4"
};
function icon(id){
  const svg=el("svg",{viewBox:"0 0 24 24","aria-hidden":"true"});el("path",{d:icons[id]},svg);return svg;
}
function button(parent,text,action,opts={}){
  const b=htmlEl("button",{type:"button","data-action":action});
  if(opts.icon)b.append(icon(opts.icon));
  if(opts.sample)b.append(htmlEl("span",{class:"swatch "+opts.sample,"aria-hidden":"true"}));
  b.append(document.createTextNode(text));
  if(opts.primary)b.classList.add("primary");
  if(opts.on!==undefined)b.setAttribute("aria-pressed",String(!!opts.on));
  if(opts.disabled)b.disabled=true;
  if(opts.title)b.title=opts.title;
  parent.append(b);return b;
}
function select(parent,items,value,id,label){
  const n=htmlEl("select",{id,"aria-label":label});
  const groups=new Map();
  for(const [key,name,group] of items){
    if(group&&!groups.has(group)){
      const section=htmlEl("optgroup",{label:group});n.append(section);groups.set(group,section);
    }
    (groups.get(group)||n).append(new Option(name,key));
  }
  n.value=String(value);parent.append(n);return n;
}
function openDialog(title){
  const dialog=$("panelDialog");$("dialogTitle").textContent=title;
  const body=$("dialogBody");body.className="fields";body.replaceChildren();
  if(!dialog.open)dialog.showModal();return body;
}
function closeDialog(){if($("panelDialog").open)$("panelDialog").close()}
function geometryKey(x){let h=2166136261;for(const c of JSON.stringify(x)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function describeDims(shape){return shape.mmSpan.map(v=>Math.round(v)).join(" × ")+" mm"}




function el(tag,attrs={},parent=null,text=null){
  const n=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([k,v])=>{if(v!==null&&v!==undefined)n.setAttribute(k,String(v))});
  if(text!==null)n.textContent=text;
  if(parent)parent.appendChild(n);
  return n;

/* Robustno določanje vidnosti robov v izometrični projekciji.
   Rob razdelimo povsod, kjer njegova projekcija seka mejo katerekoli zunanje

/* =========================================================================
   RENDERER v5 · univerzalni izris robov
   -------------------------------------------------------------------------
   Ključna sprememba: projekcijski rob se razdeli tudi ob KOLINEARNEM
   prekrivanju. Tako skriti rob ne more "pogledati skozi" vidno ploskev,
   vidni rob pa vedno dobi prednost pred skritim.

const RENDER_EPS=1e-7;

function pushSplitT(ts,t){
  if(!Number.isFinite(t))return;
  t=clamp(t,0,1);
  if(t<=RENDER_EPS)t=0;
  else if(t>=1-RENDER_EPS)t=1;
  ts.push(t);
}


/* Doda vse pomembne parametre t, tudi meji kolinearnega prekrivanja. */
function addSegmentSplitParams2D(a,b,c,d,ts){
  const r=sub2v(b,a),s=sub2v(d,c),rr=dot2v(r,r);
  if(rr<RENDER_EPS)return;
  const q=sub2v(c,a),den=cross2v(r,s);


  if(Math.abs(den)>RENDER_EPS){
    const t=cross2v(q,s)/den;
    const u=cross2v(q,r)/den;
    if(t>-RENDER_EPS&&t<1+RENDER_EPS&&u>-RENDER_EPS&&u<1+RENDER_EPS)pushSplitT(ts,t);
    return;
  }


  // Vzporedni, vendar ne kolinearni črti.
  if(Math.abs(cross2v(q,r))>RENDER_EPS)return;


  // Kolinearno prekrivanje: pomembna sta začetek in konec prekrivanja.
  const tC=dot2v(sub2v(c,a),r)/rr;
  const tD=dot2v(sub2v(d,a),r)/rr;
  const lo=Math.max(0,Math.min(tC,tD));
  const hi=Math.min(1,Math.max(tC,tD));
  if(hi>=lo-RENDER_EPS){
    pushSplitT(ts,lo);
    pushSplitT(ts,hi);
  }
}
function uniqueSortedTs(ts){
  ts.sort((a,b)=>a-b);

  ts.forEach(t=>{

  });
  if(!out.length||out[0]>RENDER_EPS)out.unshift(0);
  if(out[out.length-1]<1-RENDER_EPS)out.push(1);
  return out;

  const logicalEdges=allShapeEdges(shape);
  const coverTest = occlusionTest(shape,origin,scale);
  const projectedSplitEdges=logicalEdges.map(e=>[
    isoProject(e.a,origin,scale),
    isoProject(e.b,origin,scale)

  const atomic=[];


  (segments||logicalEdges).forEach(e=>{
    const A=isoProject(e.a,origin,scale),B=isoProject(e.b,origin,scale);
    const ts=[0,1];


    // Delimo samo ob DEJANSKIH geometrijskih robovih. Notranje meje med
    // koplanarnimi ploščicami niso geometrijski rob in zato ne ustvarjajo šivov.
    projectedSplitEdges.forEach(([c,d])=>addSegmentSplitParams2D(A,B,c,d,ts));
    const cuts=uniqueSortedTs(ts);


    for(let i=0;i<cuts.length-1;i++){
      const t0=cuts[i],t1=cuts[i+1];
      if(t1-t0<1e-6)continue;
      const tm=(t0+t1)/2;
      const p3=pointLerp(e.a,e.b,tm);
      const a2=[A[0]+(B[0]-A[0])*t0,A[1]+(B[1]-A[1])*t0];
      const b2=[A[0]+(B[0]-A[0])*t1,A[1]+(B[1]-A[1])*t1];
      const piece={

  // Če je vsaj eden viden, je končni odsek viden.
  const dedup=new Map();
  atomic.forEach(p=>{
    const k=projectedPieceKey2(p.a2,p.b2),old=dedup.get(k);
    if(!old||(old.hidden&&!p.hidden))dedup.set(k,p);

  // Skriti najprej, vidni zadnji — vidni rob zato nikoli ne izgine pod črtkano črto.
  const out=[...dedup.values()];
  out.sort((a,b)=>{
    if(a.hidden!==b.hidden)return a.hidden?-1:1;
    const A=projectedPieceKey2(a.a2,a.b2),B=projectedPieceKey2(b.a2,b.b2);

  });

  if(drawingCache.has(shape))return drawingCache.get(shape);
  // Work in unscaled view coordinates. Join touching intervals only on the same
  // supporting line and with the same visibility. A crossing never joins lines.
  const groups=new Map();
  for(const p of robustProjectedEdgePieces(shape,[0,0],1)){
    let dx=p.b2[0]-p.a2[0],dy=p.b2[1]-p.a2[1];
    const length=Math.hypot(dx,dy);
    dx/=length;dy/=length;
    if(dx< -1e-7||(Math.abs(dx)<1e-7&&dy<0)){dx=-dx;dy=-dy}
    const offset=dx*p.a2[1]-dy*p.a2[0];
    const key=[dx,dy,offset].map(v=>Math.round(v*1e6)).join(",")+"/"+p.hidden;
    const group=groups.get(key)||[];
    const a=pointLerp(p.edge.a,p.edge.b,p.t0),b=pointLerp(p.edge.a,p.edge.b,p.t1);
    const lo=dx*p.a2[0]+dy*p.a2[1],hi=dx*p.b2[0]+dy*p.b2[1];
    group.push(lo<hi?{a,b,lo,hi,hidden:p.hidden}:{a:b,b:a,lo:hi,hi:lo,hidden:p.hidden});
    groups.set(key,group);
  }
  const segments=[];
  for(const group of groups.values()){
    group.sort((a,b)=>a.lo-b.lo);
    let merged=null;
    for(const piece of group){
      if(merged&&piece.lo<=merged.hi+1e-6){
        if(piece.hi>merged.hi){merged.hi=piece.hi;merged.b=piece.b}
      }else{
        merged={...piece};segments.push(merged);
      }
    }
  }
  const result=segments.map(({a,b,hidden})=>({a,b,key:projectedEdgeKey3(a,b),expectedLineMode:hidden?"hidden":"visible"}));
  drawingCache.set(shape,result);
  return result;
}


function faceClass(n){

  return "face-cut";
}
function fitShape(shape,box,zoom=.92){
  const raw=shape.vertices.map(p=>isoProject(p,[0,0],1));
  const xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sx=(box.x2-box.x1)/Math.max(.001,maxX-minX),sy=(box.y2-box.y1)/Math.max(.001,maxY-minY);
  const scale=Math.min(sx,sy)*zoom;
  const rawCx=(minX+maxX)/2,rawCy=(minY+maxY)/2;
  const cx=(box.x1+box.x2)/2,cy=(box.y1+box.y2)/2;
  return {scale,origin:[cx-rawCx*scale,cy-rawCy*scale]};
}

function drawIsometricPaperGrid(svg,origin,scale){
  const W=1000,H=680;
  const spacing=COS30*scale;
  const L=Math.hypot(W,H)*1.65;
  const families=[
    {d:[-COS30,SIN30],n:[SIN30,COS30],cls:"draw-paper-grid"},
    {d:[ COS30,SIN30],n:[SIN30,-COS30],cls:"draw-paper-grid"},
    {d:[0,-1],n:[1,0],cls:"draw-paper-grid-z"}
  ];
  const maxK=Math.ceil((Math.hypot(W,H)+Math.abs(origin[0]-W/2)+Math.abs(origin[1]-H/2))/spacing)+6;
  families.forEach(f=>{
    for(let k=-maxK;k<=maxK;k++){
      const cx=origin[0]+f.n[0]*spacing*k;
      const cy=origin[1]+f.n[1]*spacing*k;
      line2(svg,[cx-f.d[0]*L,cy-f.d[1]*L],[cx+f.d[0]*L,cy+f.d[1]*L],{class:f.cls});
    }
  });
}

function midpoint2(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2]}
function lineIntersection2(a,b,c,d){
  const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d[0],y4=d[1];
  const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(den)<1e-9)return[(x1+x2+x3+x4)/4,(y1+y2+y3+y4)/4];
  const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den;
  const py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;
  return[px,py];
}
function normAngle(a){
  const t=Math.PI*2;
  return((a%t)+t)%t;
}
function angleDistance(a,b){
  const d=Math.abs(normAngle(a)-normAngle(b));
  return Math.min(d,Math.PI*2-d);
}
function drawCircularArcByTarget(svg,center,p1,p2,targetAngle,className){
  const a1=Math.atan2(p1[1]-center[1],p1[0]-center[0]);
  const a2=Math.atan2(p2[1]-center[1],p2[0]-center[0]);
  const r=Math.hypot(p1[0]-center[0],p1[1]-center[1]);
  let pos=normAngle(a2-a1);
  if(pos<1e-9)pos=Math.PI*2;
  const neg=pos-Math.PI*2;
  const midPos=a1+pos/2,midNeg=a1+neg/2;
  const delta=angleDistance(midPos,targetAngle)<=angleDistance(midNeg,targetAngle)?pos:neg;
  const d="M "+p1.join(" ")+" A "+r+" "+r+" 0 "+(Math.abs(delta)>Math.PI?1:0)+" "+(delta>0?1:0)+" "+p2.join(" ");
  el("path",{d,class:className,fill:"none"},svg);
}
function circleConstructionGeometry(origin=[500,250],scale=60){
  const d=CIRCLE_LESSON.sideUnits;
  const T1=isoProject([0,0,0],origin,scale);
  const L=isoProject([d,0,0],origin,scale);
  const T2=isoProject([d,d,0],origin,scale);
  const R=isoProject([0,d,0],origin,scale);
  const A=midpoint2(T1,L),B=midpoint2(L,T2),C=midpoint2(T2,R),D=midpoint2(R,T1);
  const T3=lineIntersection2(T1,B,T2,A);
  const T4=lineIntersection2(T1,C,T2,D);
  return{T1,L,T2,R,A,B,C,D,T3,T4};
}
function drawCirclePoint(svg,p,label,current=false){

}
/* Nazoren prikaz uporabe šestila:
   - dvojni obroč = mesto, kamor zapičimo konico šestila;
   - črtkana oranžna črta = odprtje/polmer šestila;
   - obroč na krajišču = točka, do katere šestilo odpremo.
   Prikazujemo ga samo v trenutnem koraku risanja loka, zato ne obremeni končne risbe. */
function drawCompassSetup(svg,center,touch,centerLabel,touchLabel){
  const warm=C.warm||"#b36b25";
  const dx=touch[0]-center[0],dy=touch[1]-center[1];
  const len=Math.max(1,Math.hypot(dx,dy));
  const ux=dx/len,uy=dy/len;
  const nx=-uy,ny=ux;


  // Polmer oziroma odprtje šestila.
  line2(svg,center,touch,{
    stroke:warm,"stroke-width":2.4,"stroke-dasharray":"7 5",
    "stroke-linecap":"round",opacity:.95
  });


  // Jasno označeno mesto vboda šestila.
  el("circle",{cx:center[0],cy:center[1],r:13,fill:"#fff",stroke:warm,"stroke-width":3},svg);
  el("circle",{cx:center[0],cy:center[1],r:4.5,fill:warm,stroke:"#fff","stroke-width":1.4},svg);
  line2(svg,[center[0]-17,center[1]],[center[0]+17,center[1]],{stroke:warm,"stroke-width":1.5});
  line2(svg,[center[0],center[1]-17],[center[0],center[1]+17],{stroke:warm,"stroke-width":1.5});


  // Točka, do katere odpremo šestilo.
  el("circle",{cx:touch[0],cy:touch[1],r:8,fill:"#fff",stroke:warm,"stroke-width":2.5},svg);
  el("circle",{cx:touch[0],cy:touch[1],r:3.2,fill:warm},svg);


  // Besedilo odmaknemo pravokotno na polmer, da ne leži na črti.
  const side=(center[0]<520)?1:-1;
  text2(svg,center[0]+side*22,center[1]-22,`ZAPIČI ŠESTILO · ${centerLabel}`,"tech-dim",side>0?"start":"end");
  const mx=(center[0]+touch[0])/2+nx*18;
  const my=(center[1]+touch[1])/2+ny*18;
  text2(svg,mx,my,`polmer do ${touchLabel}`,"tech-dim");
}
function drawCircleConstruction(svg,step,{origin=[500,250],scale=60,preview=false}={}){
  const g=circleConstructionGeometry(origin,scale);
  const maxStep=17;
  const s=clamp(step,0,maxStep);
  const finalOnly=s===17;


  const sidePairs=[[g.T1,g.L],[g.L,g.T2],[g.T2,g.R],[g.R,g.T1]];
  if(!finalOnly){
    sidePairs.forEach((pair,i)=>{
      if(s<i)return;
      line2(svg,pair[0],pair[1],{class:s===i?"current-line":"construction-line"});
    });
    if(s<4){
      const tangent=sub2(g.L,g.T1),length=len2(tangent),normal=[-tangent[1]/length,tangent[0]/length];
      for(let mm=0;mm<=CIRCLE_LESSON.diameterMm;mm+=10){
        const p=pointLerp(g.T1,g.L,mm/CIRCLE_LESSON.diameterMm);
        line2(svg,sub2(p,normal.map(v=>v*3)),p.map((v,i)=>v+normal[i]*3),{class:"dimension-line"});
      }
      const M=midpoint2(g.T1,g.L);
      text2(svg,M[0]-4,M[1]-18,`Ø ${CIRCLE_LESSON.diameterMm} mm`,"tech-dim measured-label");
    }
    const mids=[["A",g.A,4],["B",g.B,5],["C",g.C,6],["D",g.D,7]];
    mids.forEach(([lab,p,st])=>{if(s>=st)drawCirclePoint(svg,p,lab,s===st)});
    if(s>=8){
      line2(svg,g.A,g.C,{class:s===8?"current-line":"construction-guide"});
      line2(svg,g.B,g.D,{class:s===8?"current-line":"construction-guide"});
    }
    if(s>=9)line2(svg,g.T1,g.B,{class:s===9?"current-line":"construction-guide"});
    if(s>=10){
      line2(svg,g.T2,g.A,{class:s===10?"current-line":"construction-guide"});
      drawCirclePoint(svg,g.T3,"T₃",s===10);
    }
    if(s>=11)line2(svg,g.T1,g.C,{class:s===11?"current-line":"construction-guide"});
    if(s>=12){
      line2(svg,g.T2,g.D,{class:s===12?"current-line":"construction-guide"});
      drawCirclePoint(svg,g.T4,"T₄",s===12);
    }
    if(s>=9)drawCirclePoint(svg,g.T1,"T₁",s===9||s===13);
    if(s>=10)drawCirclePoint(svg,g.T2,"T₂",s===10||s===14);
  }


  // Štirje loki. V trenutnem koraku jasno pokažemo tudi mesto vboda
  // in odprtje šestila. Prejšnji loki ostanejo čisti, brez dodatnih oznak.
  if(!preview&&!finalOnly){
    if(s===13)drawCompassSetup(svg,g.T1,g.B,"T₁","B");
    if(s===14)drawCompassSetup(svg,g.T2,g.A,"T₂","A");
    if(s===15)drawCompassSetup(svg,g.T3,g.A,"T₃","A");
    if(s===16)drawCompassSetup(svg,g.T4,g.C,"T₄","C");
  }
  if(s>=13)drawCircularArcByTarget(svg,g.T1,g.B,g.C,Math.PI/2,s===13?"current-line":"visible-edge");
  if(s>=14)drawCircularArcByTarget(svg,g.T2,g.A,g.D,-Math.PI/2,s===14?"current-line":"visible-edge");
  if(s>=15)drawCircularArcByTarget(svg,g.T3,g.A,g.B,Math.PI,s===15?"current-line":"visible-edge");
  if(s>=16)drawCircularArcByTarget(svg,g.T4,g.C,g.D,0,s===16?"current-line":"visible-edge");


}

// The filled profile can still be painted as one polygon without diagonal seams.
function triangulateProfile(profile){
  const ring=profile.slice(),triangles=[];
  const turn=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  while(ring.length>3){
    const n=ring.length;
    const i=ring.findIndex((b,i)=>{
      const a=ring[(i+n-1)%n],c=ring[(i+1)%n];
      return turn(a,b,c)>0&&!ring.some(p=>p!==a&&p!==b&&p!==c&&turn(a,b,p)>=0&&turn(b,c,p)>=0&&turn(c,a,p)>=0);
    });
    if(i<0)throw Error("Neveljaven obris narisa.");
    triangles.push([ring[(i+n-1)%n],ring[i],ring[(i+1)%n]]);
    ring.splice(i,1);
  }
  triangles.push(ring);
  return triangles;
}
function buildProfileShape(ex){
  const width=Math.max(...ex.profile.map(p=>p[0])),height=Math.max(...ex.profile.map(p=>p[1]));
  const point=([u,z],y)=>[width-u,y,z];
  const triangles=triangulateProfile(ex.profile);
  const faces=[0,ex.depthMm].flatMap(y=>triangles.map(tri=>({
    pts:tri.map(p=>point(p,y)),normal:[0,y===0?-1:1,0]
  })));
  const sides=ex.profile.map((a,i)=>{
    const b=ex.profile[(i+1)%ex.profile.length],du=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(du,dz);
    return {pts:[point(a,0),point(b,0),point(b,ex.depthMm),point(a,ex.depthMm)],normal:[-dz/l,0,-du/l],u:(a[0]+b[0])/2};
  });
  const front=ex.profile.map(p=>point(p,ex.depthMm));
  const max=[width,ex.depthMm,height];
  return {faces:faces.concat(sides),front,sides,vertices:[...front,...ex.profile.map(p=>point(p,0))],
    bounds:{min:[0,0,0],max},span:max,mmSpan:max};
}

// Covered intervals along a stroke in the plane of the drawing, from 0 to 1.
// Only collinear overlap contributes length. Touches and crossings contribute none.
function projectedCoverage(target,lines){
  const {a,b}=projectedSegment(target),v=sub2(b,a),length=len2(v),intervals=[];
  if(length<1e-8)return [];
  for(const line of lines){
    const l=projectedSegment(line),u=sub2(l.b,l.a),size=len2(u);
    if(size<1e-8||Math.abs(cross2(v,u))>1e-5*length*size||
       Math.abs(cross2(v,sub2(l.a,a)))>1e-5*length)continue;
    const t1=dot2(sub2(l.a,a),v)/(length*length),t2=dot2(sub2(l.b,a),v)/(length*length);
    const lo=Math.max(0,Math.min(t1,t2)),hi=Math.min(1,Math.max(t1,t2));
    if(lo+1e-7<hi)intervals.push([lo,hi]);
  }
  intervals.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const [lo,hi] of intervals){
    const last=merged[merged.length-1];
    if(last&&lo<=last[1]+1e-5)last[1]=Math.max(last[1],hi);
    else merged.push([lo,hi]);
  }
  return merged;
}
function coverageLength(intervals){return intervals.reduce((sum,[lo,hi])=>sum+hi-lo,0)}

}
function drawTargetAnalysis(target){
  const visible=drawCoverageFraction(target,"visible");
  const hidden=drawCoverageFraction(target,"hidden");
  if(target.expectedLineMode==="visible"){
    if(visible>=.9995){
      return {target,status:"correct",warning:hidden>1e-4,
        note:hidden>1e-4?"Vidni rob je pravilno narisan. Na istem delu je ostala tudi črtkana črta; vidni rob ima prednost.":""};
    }
    if(hidden>1e-4)return {target,status:"wrong",warning:false,note:"Ta rob mora biti viden (poln), ne samo črtkan."};
    return {target,status:"missing",warning:false,note:"Vidni rob manjka."};
  }
  // Pri skritem robu ima morebitna polna črta prednost in zato spremeni pomen risbe.
  if(visible>1e-4)return {target,status:"wrong",warning:false,note:"Ta rob mora biti skrit (črtkan), vendar je na njem tudi polna črta."};
  if(hidden>=.9995)return {target,status:"correct",warning:false,note:""};

}

  const wrong=analyses.filter(a=>a.status==="wrong").map(a=>a.target);

function drawGenericArcPath(svg,c,p1,p2,cls){
  const r1=Math.hypot(p1[0]-c[0],p1[1]-c[1]),r2=Math.hypot(p2[0]-c[0],p2[1]-c[1]);
  const r=(r1+r2)/2;if(r<1e-6)return;
  let a1=Math.atan2(p1[1]-c[1],p1[0]-c[0]),a2=Math.atan2(p2[1]-c[1],p2[0]-c[0]);
  let d=a2-a1;while(d>Math.PI)d-=Math.PI*2;while(d<=-Math.PI)d+=Math.PI*2;
  const end=a1+d;
  const q1=[c[0]+r*Math.cos(a1),c[1]+r*Math.sin(a1)],q2=[c[0]+r*Math.cos(end),c[1]+r*Math.sin(end)];
  const sweep=d>=0?1:0;
  el("path",{d:`M ${q1[0]} ${q1[1]} A ${r} ${r} 0 0 ${sweep} ${q2[0]} ${q2[1]}`,class:cls},svg);
}
function assembleAlignment(ex,heights){
  const {nx,ny}=ex.bounds;
  let best=null;
  for(let dy=0;dy<=ASSEMBLE_N-ny;dy++)for(let dx=0;dx<=ASSEMBLE_N-nx;dx++){
    let missing=0,extra=0,wrongCols=0;
    for(let y=0;y<ASSEMBLE_N;y++)for(let x=0;x<ASSEMBLE_N;x++){
      const delta=heights[y][x]-(ex.heights[y-dy]?.[x-dx]||0);
      if(delta!==0)wrongCols++;
      if(delta<0)missing-=delta;else extra+=delta;
    }
    const errors=missing+extra;
    if(!best||errors<best.errors||(errors===best.errors&&wrongCols<best.wrongCols))
      best={missing,extra,wrongCols,errors,dx,dy};
  }
  return best;
}


function profilePaperPoint(q){const y=q[0]/COS30;return [0,y,y*SIN30-q[1]]}
function nearestProfilePoint(pos,fit){
  const q=[(pos[0]-fit.origin[0])/fit.scale,(pos[1]-fit.origin[1])/fit.scale];
  const step=PROFILE_GRID_MM,base=profilePaperPoint(q);
  const pixelsPerUnit=fit.scale*(mainSvg.getScreenCTM?.()?.a||1);
  const radius=Math.min(step*.56,Math.max(step*.27,12/pixelsPerUnit));
  let best=null,dist=radius;
  const consider=p=>{
    const v=projectDrawingPoint(p),d=Math.hypot(v[0]-q[0],v[1]-q[1]);
    if(d<=dist){best=p;dist=d}
  };
  const column=Math.round(base[1]/step);
  for(let i=column-1;i<=column+1;i++){
    const y=i*step;consider([0,y,Math.round((y*SIN30-q[1])/step)*step]);
  }
  for (const p of drawRuntime().betweenNodes) consider(p);
  const nearby=[];
  for(const line of state.drawLines){
    const {a,b}=projectedSegment(line),v=sub2(b,a),vv=dot2(v,v);
    if(vv<1e-10)continue;
    const t=clamp(dot2(sub2(q,a),v)/vv,0,1);
    if(Math.hypot(a[0]+v[0]*t-q[0],a[1]+v[1]*t-q[1])>radius)continue;
    consider(line.a);consider(line.b);
    const pa=profilePaperPoint(a),pb=profilePaperPoint(b);
    for(const family of [p=>p[1],p=>p[2],p=>p[2]-p[1]]){
      const start=family(pa),span=family(pb)-start;
      if(Math.abs(span)<1e-8)continue;
      const k=Math.round(family(base)/step);
      for(let i=k-1;i<=k+1;i++){
        const t=(i*step-start)/span;
        if(t>0&&t<1)consider(pointLerp(pa,pb,t));
      }
    }
    for(const other of nearby){
      const den=cross2(v,other.v);
      if(Math.abs(den)<1e-8)continue;
      const w=sub2(other.a,a),s=cross2(w,other.v)/den,t=cross2(w,v)/den;
      if(s>=0&&s<=1&&t>=0&&t<=1)consider(pointLerp(pa,pb,s));
    }
    nearby.push({a,v});
  }
  return best;
}




function norm2(v){
  const l=Math.hypot(v[0],v[1])||1;
  return[v[0]/l,v[1]/l];
}
function dotScreen(a,b){return a[0]*b[0]+a[1]*b[1]}
function subScreen(a,b){return[a[0]-b[0],a[1]-b[1]]}
function addScreen(a,b){return[a[0]+b[0],a[1]+b[1]]}
function mulScreen(a,s){return[a[0]*s,a[1]*s]}


function assembleAxisScreenDir(axis,fit){
  const O=isoProject(assembleModelPoint([0,0,0]),fit.origin,fit.scale);
  const P=axis==="x"
    ?isoProject(assembleModelPoint([1,0,0]),fit.origin,fit.scale)
    :axis==="y"
      ?isoProject(assembleModelPoint([0,1,0]),fit.origin,fit.scale)
      :isoProject(assembleModelPoint([0,0,1]),fit.origin,fit.scale);
  return norm2([P[0]-O[0],P[1]-O[1]]);
}
function assemblePreferredNormal(axis,fit){
  const d=assembleAxisScreenDir(axis,fit);
  const a=norm2([-d[1],d[0]]),b=[-a[0],-a[1]];
  if(axis==="x"){
    // x mera naj bo praviloma zunaj zgoraj/levo.
    return (a[0]+a[1])<(b[0]+b[1])?a:b;
  }
  if(axis==="y"){
    // y mera naj bo praviloma zunaj zgoraj/desno.
    return (-a[0]+a[1])<(-b[0]+b[1])?a:b;
  }
  return null; // pri z naj odloči dejanski prosti prostor
}


const ASSEMBLE_DIM_PROJECTION_CACHE=new WeakMap();
function assembleDimensionBoundaryPoints(shape,fit){
  const sig=`${fit.origin[0].toFixed(4)},${fit.origin[1].toFixed(4)},${fit.scale.toFixed(6)}`;
  const old=ASSEMBLE_DIM_PROJECTION_CACHE.get(shape);
  if(old&&old.sig===sig)return old.points;
  const visible=robustProjectedEdgePieces(shape,fit.origin,fit.scale).filter(p=>!p.hidden);
  const points=visible.flatMap(p=>[p.a2,p.b2]);
  ASSEMBLE_DIM_PROJECTION_CACHE.set(shape,{sig,points});
  return points;
}
function assembleShapeExtremeAlong(shape,fit,n,which="max"){
  const vals=assembleDimensionBoundaryPoints(shape,fit).map(q=>dotScreen(q,n));
  return which==="min"?Math.min(...vals):Math.max(...vals);
}
function assembleDistancePointToBoundary(p,shape,fit){
  const pts=assembleDimensionBoundaryPoints(shape,fit);
  let best=Infinity;
  pts.forEach(q=>{best=Math.min(best,Math.hypot(p[0]-q[0],p[1]-q[1]))});
  return best;
}
function assembleShapeVertexSet(shape){
  return new Set(shape.vertices.map(vKey));
}
function assembleHasShapeVertex(vset,p){
  return vset.has(vKey(assembleModelPoint(p)));
}


/* Poiščemo dejanski rob/linijo telesa, ki nosi celotno mero.
   Za x in y najprej iščemo na osnovni ravnini z=0, zato skupni meri ne
   "visita" nad vrhom telesa. Šele nato dovolimo višje nosilne črte. */
function assembleOverallBaseCandidates(ex,shape,axis){
  const {nx,ny,nz}=ex.bounds,vset=assembleShapeVertexSet(shape),out=[];
  const add=(a,b,z=0)=>{
    const ra=assembleHasShapeVertex(vset,a),rb=assembleHasShapeVertex(vset,b);
    if(!ra&&!rb)return;
    out.push({a,b,real:(ra?1:0)+(rb?1:0),z});
  };
  if(axis==="x"){
    for(let z=0;z<=nz;z++)for(let y=0;y<=ny;y++)add([0,y,z],[nx,y,z],z);
  }else if(axis==="y"){
    for(let z=0;z<=nz;z++)for(let x=0;x<=nx;x++)add([x,0,z],[x,ny,z],z);
  }else{
    for(let y=0;y<=ny;y++)for(let x=0;x<=nx;x++)add([x,y,0],[x,y,nz],0);
  }
  if(!out.length){
    if(axis==="x"){
      [0,ny].forEach(y=>add([0,y,0],[nx,y,0],0));
    }else if(axis==="y"){
      [0,nx].forEach(x=>add([x,0,0],[x,ny,0],0));
    }else{
      [0,nx].forEach(x=>[0,ny].forEach(y=>add([x,y,0],[x,y,nz],0)));
    }
  }
  // Najprej dejanski par krajišč, nato osnovna ravnina.
  out.sort((a,b)=>(b.real-a.real)||(a.z-b.z));
  return out;
}


function assembleDimensionTextMetrics(label){
  const size=dimensionFont;
  return {w:Math.max(size,label.length*size*.57 + 6),h:size*1.18};
}
function assembleDimensionText(svg,x,y,label,kind="part"){
  const {w,h}=assembleDimensionTextMetrics(label);
  const mask=el("rect",{x:x-w/2,y:y-h/2+1,width:w,height:h,rx:2,ry:2,class:"assemble-dim-mask"},svg);
  const text=text2(svg,x,y+dimensionFont*.31,label,`assemble-dim-text ${kind}`);
  return {text,mask};
}
function assembleBoxOverlap(a,b,pad=2){
  return !(a.x2+pad<b.x1||b.x2+pad<a.x1||a.y2+pad<b.y1||b.y2+pad<a.y1);
}
function assembleOrient2(a,b,c){
  return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
}
function assembleSegmentsCross(a,b,c,d){
  const eps=1e-6;
  const o1=assembleOrient2(a,b,c),o2=assembleOrient2(a,b,d);
  const o3=assembleOrient2(c,d,a),o4=assembleOrient2(c,d,b);
  return ((o1>eps&&o2<-eps)||(o1<-eps&&o2>eps)) &&
         ((o3>eps&&o4<-eps)||(o3<-eps&&o4>eps));
}
function assembleCandidateOverflow(box,safe){
  let p=0;
  if(box.x1<safe.x1)p+=safe.x1-box.x1;
  if(box.x2>safe.x2)p+=box.x2-safe.x2;
  if(box.y1<safe.y1)p+=safe.y1-box.y1;
  if(box.y2>safe.y2)p+=box.y2-safe.y2;
  return p;
}
function assembleDimensionCandidate(shape,fit,base,label,axis,n,gapPx,kind,ctx){
  const A=isoProject(assembleModelPoint(base.a),fit.origin,fit.scale);
  const B=isoProject(assembleModelPoint(base.b),fit.origin,fit.scale);
  const baseCoord=(dotScreen(A,n)+dotScreen(B,n))/2;
  const extreme=assembleShapeExtremeAlong(shape,fit,n,"max");
  const target=extreme+gapPx;
  const shift=Math.max(0,target-baseCoord);
  const AO=addScreen(A,mulScreen(n,shift));
  const BO=addScreen(B,mulScreen(n,shift));


  const tm=assembleDimensionTextMetrics(label);
  // Slopes use a separate label layer outside the silhouette. Assembly sheets use inset labels.
  const textGap=ctx.outsideLabels?(Math.abs(n[0])*tm.w+Math.abs(n[1])*tm.h)/2+5:(kind==="overall"?13:11);
  const M=addScreen(midpoint2(AO,BO),mulScreen(n,textGap));
  const labelBox={x1:M[0]-tm.w/2,y1:M[1]-tm.h/2,x2:M[0]+tm.w/2,y2:M[1]+tm.h/2};
  const safe=ctx.safe;
  let score=shift*.26 + (base.real===2?0:base.real===1?90:220) + (axis!=="z"?base.z*10:0);


  // Pri x/y dajemo prednost tradicionalni zunanji zgornji strani,
  // vendar jo lahko kolizija ali rob polja preglasi.
  const pref=assemblePreferredNormal(axis,fit);
  if(pref)score+=(1-dotScreen(n,pref))*85;


  const overflow=assembleCandidateOverflow(labelBox,safe)
    +assembleCandidateOverflow({
      x1:Math.min(AO[0],BO[0]),y1:Math.min(AO[1],BO[1]),
      x2:Math.max(AO[0],BO[0]),y2:Math.max(AO[1],BO[1])
    },safe);
  score+=overflow*150;


  // Krajša podaljšnica in dejanska vidna krajišča imata prednost.
  score+=(assembleDistancePointToBoundary(A,shape,fit)+assembleDistancePointToBoundary(B,shape,fit))*.35;


  const startGap=Math.min(7,Math.max(4,fit.scale*ASSEMBLE_MODEL_SCALE*.07));
  const over=5;
  const EA0=addScreen(A,mulScreen(n,startGap)),EA1=addScreen(AO,mulScreen(n,over));
  const EB0=addScreen(B,mulScreen(n,startGap)),EB1=addScreen(BO,mulScreen(n,over));
  const lines=[[AO,BO],[EA0,EA1],[EB0,EB1]];


  for(const item of ctx.items){
    if(assembleBoxOverlap(labelBox,item.labelBox,3))score+=12000;
    for(const l1 of lines)for(const l2 of item.lines)
      if(assembleSegmentsCross(l1[0],l1[1],l2[0],l2[1]))score+=6500;
  }


  return{score,A,B,AO,BO,M,labelBox,lines,n,base,kind,label,startGap,over};
}
function assembleChooseDimensionPlacement(shape,fit,bases,label,axis,kind,ctx){
  const d=assembleAxisScreenDir(axis,fit),n0=norm2([-d[1],d[0]]);
  const normals=[n0,[-n0[0],-n0[1]]];
  const cubePx=fit.scale*ASSEMBLE_MODEL_SCALE;
  const laneFactors=kind==="overall"?[.52,.68,.84,1.00]:[.23,.34,.45,.58];
  const candidates=[];
  bases.slice(0,18).forEach(base=>{
    normals.forEach(n=>{
      laneFactors.forEach(f=>{
        candidates.push(assembleDimensionCandidate(shape,fit,base,label,axis,n,cubePx*f,kind,ctx));
      });
    });
  });
  candidates.sort((a,b)=>a.score-b.score);
  return candidates[0]||null;
}
function assembleDrawChosenDimension(svg,c,ctx){
  if(!c)return;
  line2(svg,c.lines[1][0],c.lines[1][1],{class:"assemble-dim-ext"});
  line2(svg,c.lines[2][0],c.lines[2][1],{class:"assemble-dim-ext"});
  line2(svg,c.AO,c.BO,{class:`assemble-dim ${c.kind}`});


  const tick=5.5,n=c.n;
  line2(svg,[c.AO[0]-n[0]*tick,c.AO[1]-n[1]*tick],[c.AO[0]+n[0]*tick,c.AO[1]+n[1]*tick],{class:`assemble-dim ${c.kind}`});
  line2(svg,[c.BO[0]-n[0]*tick,c.BO[1]-n[1]*tick],[c.BO[0]+n[0]*tick,c.BO[1]+n[1]*tick],{class:`assemble-dim ${c.kind}`});
  const annotation=assembleDimensionText(ctx.labels||svg,c.M[0],c.M[1],c.label,c.kind);
  ctx.items.push({labelBox:c.labelBox,lines:c.lines,axis:c.axis,annotation});
}
function assembleDrawDimension(svg,shape,fit,bases,label,axis,kind,ctx){
  const c=assembleChooseDimensionPlacement(shape,fit,bases,label,axis,kind,ctx);
  if(c)c.axis=axis;
  assembleDrawChosenDimension(svg,c,ctx);
  return c;
}


/* Ohranjen API za posebne lokalne mere: a in b sta resnični krajišči
   merjene značilnosti in morata ležati v isti izometrični smeri. */
function assembleDrawDimExternal(svg,shape,fit,a,b,label,axis,gapPx,kind="part",ctx=null){
  const localCtx=ctx||{items:[],safe:{x1:28,y1:88,x2:412,y2:692}};
  const base={a,b,real:2,z:Math.min(a[2]||0,b[2]||0)};
  const d=assembleAxisScreenDir(axis,fit),n0=norm2([-d[1],d[0]]);
  const normals=[n0,[-n0[0],-n0[1]]];
  const candidates=normals.map(n=>assembleDimensionCandidate(shape,fit,base,label,axis,n,gapPx,kind,localCtx));
  candidates.sort((a,b)=>a.score-b.score);
  const c=candidates[0];
  if(c)c.axis=axis;
  assembleDrawChosenDimension(svg,c,localCtx);
  return c;
}


function assembleFeatureCoords(ex,axis){
  const {nx,ny,nz}=ex.bounds,h=ex.heights;
  if(axis==="x"){
    const a=[0,nx];
    for(let x=1;x<nx;x++){
      let change=false;
      for(let y=0;y<ny;y++)if((h[y]?.[x-1]||0)!==(h[y]?.[x]||0)){change=true;break}
      if(change)a.push(x);
    }
    return [...new Set(a)].sort((a,b)=>a-b);
  }
  if(axis==="y"){
    const a=[0,ny];
    for(let y=1;y<ny;y++){
      let change=false;
      for(let x=0;x<nx;x++)if((h[y-1]?.[x]||0)!==(h[y]?.[x]||0)){change=true;break}
      if(change)a.push(y);
    }
    return [...new Set(a)].sort((a,b)=>a-b);
  }
  const a=[0,nz];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)if(h[y][x]>0)a.push(h[y][x]);
  return [...new Set(a)].sort((a,b)=>a-b);
}
function assembleHasInteriorVoid(ex){
  return !!assembleInteriorVoidBox(ex);
}
function assembleInteriorVoidBox(ex){
  const {nx,ny}=ex.bounds,h=ex.heights;
  const empty=(x,y)=>x>=0&&y>=0&&x<nx&&y<ny&&(h[y]?.[x]||0)===0;
  const outside=new Set(),q=[];
  for(let x=0;x<nx;x++){
    [[x,0],[x,ny-1]].forEach(([cx,cy])=>{
      const k=`${cx},${cy}`;if(empty(cx,cy)&&!outside.has(k)){outside.add(k);q.push([cx,cy])}
    });
  }
  for(let y=0;y<ny;y++){
    [[0,y],[nx-1,y]].forEach(([cx,cy])=>{
      const k=`${cx},${cy}`;if(empty(cx,cy)&&!outside.has(k)){outside.add(k);q.push([cx,cy])}
    });
  }
  while(q.length){
    const [x,y]=q.shift();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const cx=x+dx,cy=y+dy,k=`${cx},${cy}`;
      if(empty(cx,cy)&&!outside.has(k)){outside.add(k);q.push([cx,cy])}
    });
  }
  const pts=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)
    if(empty(x,y)&&!outside.has(`${x},${y}`))pts.push([x,y]);
  if(!pts.length)return null;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  return{x0:Math.min(...xs),x1:Math.max(...xs)+1,y0:Math.min(...ys),y1:Math.max(...ys)+1};
}
function assembleVoidRimZ(ex,box){
  const h=ex.heights,vals=[];
  for(let y=box.y0;y<box.y1;y++){
    if(box.x0-1>=0&&(h[y]?.[box.x0-1]||0)>0)vals.push(h[y][box.x0-1]);
    if(box.x1<ex.bounds.nx&&(h[y]?.[box.x1]||0)>0)vals.push(h[y][box.x1]);
  }
  for(let x=box.x0;x<box.x1;x++){
    if(box.y0-1>=0&&(h[box.y0-1]?.[x]||0)>0)vals.push(h[box.y0-1][x]);
    if(box.y1<ex.bounds.ny&&(h[box.y1]?.[x]||0)>0)vals.push(h[box.y1][x]);
  }
  return vals.length?Math.min(...vals):ex.bounds.nz;
}
function assembleFindExposedUnitZ(ex){
  const {nx,ny}=ex.bounds,h=ex.heights;
  let best=null,bestScore=-Infinity;
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
    const H=h[y]?.[x]||0;if(H<=0)continue;
    for(let z=0;z<H;z++){
      const exposed=
        x===0||y===0||x===nx-1||y===ny-1||
        (h[y]?.[x-1]||0)<=z||(h[y]?.[x+1]||0)<=z||
        (h[y-1]?.[x]||0)<=z||(h[y+1]?.[x]||0)<=z;
      if(!exposed)continue;
      [[x,y],[x+1,y],[x+1,y+1],[x,y+1]].forEach(([cx,cy])=>{
        const score=z*10-cx-cy*.25;
        if(score>bestScore){bestScore=score;best={a:[cx,cy,z],b:[cx,cy,z+1]}}
      });
    }
  }
  return best;
}


function assembleDrawDetailDimensions(svg,ex,shape,fit,ctx){
  const mm=v=>String(v*ASSEMBLE_CUBE_MM);


  // Lokalna 10 mm višina: neposredno na dejanskem izpostavljenem robu.
  if(ex.bounds.nz>1){
    const zseg=assembleFindExposedUnitZ(ex);
    if(zseg)assembleDrawDimExternal(svg,shape,fit,zseg.a,zseg.b,mm(1),"z",fit.scale*ASSEMBLE_MODEL_SCALE*.23,"part",ctx);
  }


  // Zaprta odprtina: širina/globina sta vezani na dejanski rob odprtine.
  const voidBox=assembleInteriorVoidBox(ex);
  if(voidBox){
    const z=assembleVoidRimZ(ex,voidBox);
    if(voidBox.x1>voidBox.x0){
      assembleDrawDimExternal(
        svg,shape,fit,
        [voidBox.x0,voidBox.y0,z],[voidBox.x1,voidBox.y0,z],
        mm(voidBox.x1-voidBox.x0),"x",fit.scale*ASSEMBLE_MODEL_SCALE*.25,"part",ctx
      );
    }
    if(voidBox.y1>voidBox.y0){
      assembleDrawDimExternal(
        svg,shape,fit,
        [voidBox.x0,voidBox.y0,z],[voidBox.x0,voidBox.y1,z],
        mm(voidBox.y1-voidBox.y0),"y",fit.scale*ASSEMBLE_MODEL_SCALE*.25,"part",ctx
      );
    }
  }
}
function assembleOverallBasesV62(ex,shape,axis,fit){
  const {nx,ny,nz}=ex.bounds,h=ex.heights,out=[];


  if(axis==="x"){
    for(let y=0;y<ny;y++){
      if((h[y]?.[0]||0)>0&&(h[y]?.[nx-1]||0)>0){
        out.push({a:[0,y,0],b:[nx,y,0]});
        out.push({a:[0,y+1,0],b:[nx,y+1,0]});
      }
    }
    if(!out.length){
      out.push({a:[0,0,0],b:[nx,0,0]},{a:[0,ny,0],b:[nx,ny,0]});
    }
    return out;
  }


  if(axis==="y"){
    for(let x=0;x<nx;x++){
      if((h[0]?.[x]||0)>0&&(h[ny-1]?.[x]||0)>0){
        out.push({a:[x,0,0],b:[x,ny,0]});
        out.push({a:[x+1,0,0],b:[x+1,ny,0]});
      }
    }
    if(!out.length){
      out.push({a:[0,0,0],b:[0,ny,0]},{a:[nx,0,0],b:[nx,ny,0]});
    }
    return out;
  }


  // Višina: zunanji vogali najvišjih stolpcev.
  const maxCells=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)if((h[y]?.[x]||0)===nz)maxCells.push([x,y]);
  const seen=new Set();
  maxCells.forEach(([x,y])=>{
    [[x,y],[x+1,y],[x+1,y+1],[x,y+1]].forEach(([cx,cy])=>{
      const k=`${cx},${cy}`;if(seen.has(k))return;seen.add(k);
      out.push({a:[cx,cy,0],b:[cx,cy,nz]});
    });
  });
  return out.length?out:[{a:[nx,0,0],b:[nx,0,nz]}];
}
function assembleConvexHullV62(points){
  const pts=points.map(p=>[p[0],p[1]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<=2)return pts;
  const cross2=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];
  for(const p of pts){while(lo.length>=2&&cross2(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  const hi=[];
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(hi.length>=2&&cross2(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop();hi.push(p)}
  lo.pop();hi.pop();return lo.concat(hi);
}
function assemblePointInHullV62(p,hull){
  if(hull.length<3)return false;
  let sign=0;
  for(let i=0;i<hull.length;i++){
    const a=hull[i],b=hull[(i+1)%hull.length];
    const c=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
    if(Math.abs(c)<1e-6)continue;
    const s=Math.sign(c);if(!sign)sign=s;else if(sign!==s)return false;
  }
  return true;
}
function assembleSamplesOnLineV62(a,b,n=7){
  const out=[];for(let i=1;i<n;i++){const t=i/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  return out;
}
function assembleOverallCandidateScoreV62(c,hull,ctx,safe){
  let score=c.gap*18;
  // Kotirna črta in podaljšnici ne smejo teči skozi projekcijo telesa.
  const testLines=[[c.AO,c.BO],[c.A,c.AO],[c.B,c.BO]];
  testLines.forEach((ln,idx)=>{
    assembleSamplesOnLineV62(ln[0],ln[1],idx===0?11:6).forEach(p=>{
      if(assemblePointInHullV62(p,hull))score+=idx===0?18000:7000;
    });
  });


  const tm=assembleDimensionTextMetrics(c.label);
  const labelBox={x1:c.M[0]-tm.w/2,y1:c.M[1]-tm.h/2,x2:c.M[0]+tm.w/2,y2:c.M[1]+tm.h/2};
  score+=assembleCandidateOverflow(labelBox,safe)*220;


  for(const item of ctx.items){
    if(assembleBoxOverlap(labelBox,item.labelBox,4))score+=16000;
    for(const l1 of testLines)for(const l2 of item.lines||[])
      if(assembleSegmentsCross(l1[0],l1[1],l2[0],l2[1]))score+=11000;
  }
  c.labelBox=labelBox;c.lines=testLines;
  return score;
}
function assembleOverallCandidatesXYV62(ex,shape,fit,axis,label,ctx){
  const hull=assembleConvexHullV62(assembleDimensionBoundaryPoints(shape,fit));
  const bases=assembleOverallBasesV62(ex,shape,axis,fit);
  const candidates=[];
  const gaps=[.42,.58,.76,.96];
  for(const base of bases){
    const A=isoProject(assembleModelPoint(base.a),fit.origin,fit.scale);
    const B=isoProject(assembleModelPoint(base.b),fit.origin,fit.scale);
    for(const side of [-1,1])for(const gap0 of gaps){
      const gap=gap0*side;
      let a3,b3;
      if(axis==="x"){
        a3=[base.a[0],base.a[1]+gap,base.a[2]];
        b3=[base.b[0],base.b[1]+gap,base.b[2]];
      }else{
        a3=[base.a[0]+gap,base.a[1],base.a[2]];
        b3=[base.b[0]+gap,base.b[1],base.b[2]];
      }
      const AO=isoProject(assembleModelPoint(a3),fit.origin,fit.scale);
      const BO=isoProject(assembleModelPoint(b3),fit.origin,fit.scale);
      const out=norm2([AO[0]-A[0],AO[1]-A[1]]);
      const M0=[(AO[0]+BO[0])/2,(AO[1]+BO[1])/2];
      const M=addScreen(M0,mulScreen(out,13));
      const c={A,B,AO,BO,M,out,base,gap:gap0,label,axis};
      c.score=assembleOverallCandidateScoreV62(c,hull,ctx,ctx.safe);
      candidates.push(c);
    }
  }
  candidates.sort((a,b)=>a.score-b.score);
  return candidates[0]||null;
}
function assembleOverallCandidateZV62(ex,shape,fit,label,ctx){
  // skupna višina je vedno od osnovne ravnine z=0 do
  // dejansko najvišje ravnine modela. Pri centralnem visokem stolpcu
  // je lahko nosilna navpičnica znotraj silhuete; podaljšnici bomo
  // kasneje odrezali na zunanji rob silhuete.
  const actualNz=Math.max(0,...ex.heights.flat());
  const exZ={...ex,bounds:{...ex.bounds,nz:actualNz}};
  const bases=assembleOverallBasesV62(exZ,shape,"z",fit);
  const pts=assembleDimensionBoundaryPoints(shape,fit);
  const hull=assembleConvexHullV62(pts);
  const minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0]));
  const centerX=(minX+maxX)/2,cubePx=fit.scale*ASSEMBLE_MODEL_SCALE;
  const candidates=[];
  for(const base of bases){
    // Varnost: b je vedno na dejanski največji višini.
    base.a=[base.a[0],base.a[1],0];
    base.b=[base.b[0],base.b[1],actualNz];
    const A=isoProject(assembleModelPoint(base.a),fit.origin,fit.scale);
    const B=isoProject(assembleModelPoint(base.b),fit.origin,fit.scale);
    for(const side of [-1,1])for(const f of [.40,.55,.72]){
      const tx=side<0?minX-cubePx*f:maxX+cubePx*f;

function profileDiagram(svg,ex,{editable=false,help=false}={}){

  const font=unitFont(),dims=dimensionsFor(ex),pad=8,offsets=ex.offsets||{};
  svg.style.setProperty("--label-px",font+"px");
  const numWidth=v=>String(v).length*font*.61+7;
  const left=pad+numWidth(height)+font*.8;
  const right=pad+Math.max(font*.8,...dims.filter(d=>d.dir==="right").map(d=>numWidth(d.val)+font*.7));
  const topDims=dims.filter(d=>d.dir==="top"), sideDims=dims.filter(d=>d.dir==="right");
  let scale=1,topLanes=0,sideLanes=0,base=0,x0=0;

function paintProfileHint(paper,shape,fit){

  const hint=el("g",{"data-profile-aid":"plane"},paper);

    stroke:"#508a86","stroke-width":1.2,"stroke-dasharray":"5 5"},hint);

  const start=isoProject(startCorner,fit.origin,fit.scale);
  const end=isoProject([width,depth,0],fit.origin,fit.scale);
  const direction=sub2(end,start),length=len2(direction);
  if(!length)return;
  const [ux,uy]=direction.map(component=>component/length);

}

function lineCrossesLabel(box,line){
  const [ax,ay,bx,by]=line;
  if(Math.max(ax,bx)<box.x1||Math.min(ax,bx)>box.x2||Math.max(ay,by)<box.y1||Math.min(ay,by)>box.y2)return false;
  // The normal to the segment is the remaining separating axis after x and y.
  const dx=bx-ax,dy=by-ay;
  const distance=Math.abs(dx*(box.y1+box.y2-2*ay)-dy*(box.x1+box.x2-2*ax));
  return distance<=Math.abs(dx)*(box.y2-box.y1)+Math.abs(dy)*(box.x2-box.x1);
}
function lessonMeasures(svg,measures,fit,w,h){
  if(!measures.length)return;
  const font=Math.min(unitFont(),w/8,h/4);
  const placed=Array.from(svg.querySelectorAll("text"),node=>{
    const {x,y,width,height}=node.getBBox();
    return {x1:x-2,x2:x+width+2,y1:y-2,y2:y+height+2};
  });
  const labels=[],occupied=[];
  const leaders=el("g",{class:"measure-leaders"},svg);
  for(const [a,b] of measures){
    const value=len(sub(b,a)),A=isoProject(a,fit.origin,fit.scale),B=isoProject(b,fit.origin,fit.scale);
    const dx=B[0]-A[0],dy=B[1]-A[1],length=Math.hypot(dx,dy);
    if(length<1e-5)continue;
    const normal=[-dy/length,dx/length],mid=midpoint2(A,B);
    const group=el("g",{"data-measure-mm":value},svg);
    line2(group,A,B,{class:"current-line","data-measure-line":""});
    for(let mm=0;mm<=value+.001;mm+=10){
      const p=pointLerp(A,B,mm/value),half=mm===0||Math.abs(mm-value)<.001?5:3.5;
      line2(group,p.map((v,i)=>v-half*normal[i]),p.map((v,i)=>v+half*normal[i]),{class:"lesson-measure-tick"});
    }
    labels.push({value,normal,mid,length,tangent:[dx/length,dy/length]});
    for(const p of [A,B])occupied.push({x1:p[0]-5,x2:p[0]+5,y1:p[1]-5,y2:p[1]+5});
  }
  const shapeLines=Array.from(svg.querySelectorAll("line.axis-line,line.construction-guide,line.current-guide,line[data-construction-edge],line[data-measure-line]"),
    line=>["x1","y1","x2","y2"].map(key=>Number(line.getAttribute(key))));
  for(const {value,normal,mid,length,tangent} of labels){
    const node=text2(svg,0,0,mmText(value),"lesson-measure-label");
    node.style.fontSize=font+"px";
    const ink=node.getBBox(),half=ink.width/2+3,halfHeight=ink.height/2+3;
    let best=null;
    function consider(px,py,cost,leader){
      const x=clamp(px,half+3,w-half-3),y=clamp(py,halfHeight+3,h-halfHeight-3);
      const box={x1:x-half,x2:x+half,y1:y-halfHeight,y2:y+halfHeight};
      const score=placed.filter(old=>assembleBoxOverlap(old,box,5)).length*1e7
        +occupied.filter(old=>assembleBoxOverlap(old,box,3)).length*1000
        +shapeLines.filter(line=>lineCrossesLabel(box,line)).length*220
        +Math.hypot(x-px,y-py)*8+cost;
      if(!best||score<best.score)best={x,y,box,score,leader};
    }
    for(const side of [1,-1])for(const distance of [.8,1.6,2.5,3.2]){
      for(const shift of [0,-1,1,-2,2,-3,3]){
        const along=shift*Math.min(font*1.08,Math.max(length*.3,font*.7));
        const candidate=mid.map((v,i)=>v+side*normal[i]*(font*distance+Math.abs(normal[0])*half)+along*tangent[i]);
        consider(...candidate,distance*4+Math.abs(shift)*3,shift!==0||distance>1);
      }
    }
    if(best.score>=1e7){
      // There may be no free place alongside the measured edge on a narrow screen.
      for(let x=half+3;x<=w-half-2;x+=Math.max(6,half/3)){
        for(let y=halfHeight+3;y<=h-halfHeight-2;y+=Math.max(5,halfHeight/2)){
          consider(x,y,Math.hypot(x-mid[0],y-mid[1]),true);
        }
      }
    }
    if(best.leader){
      const end=[clamp(mid[0],best.box.x1,best.box.x2),clamp(mid[1],best.box.y1,best.box.y2)];
      line2(leaders,mid,end,{class:"ext-line"});
    }
    node.setAttribute("x",best.x-ink.x-ink.width/2);
    node.setAttribute("y",best.y-ink.y-ink.height/2);
    placed.push(best.box);
  }
}

  const draft=el("g",{"data-construction-edges":""},mainSvg);

  for(const item of before){
    for(const [a,b] of item.edges||[]){
      line3(draft,a,b,fit.origin,fit.scale,item===step?"current-line":"lesson-stroke",{"data-construction-edge":""});
    }

  }
  const points=el("g",{},mainSvg);
  for(const p of step.dots||[])drawPoint3(points,p,fit.origin,fit.scale,"",true);
  for(const [p,label] of step.labels||[])drawPoint3(points,p,fit.origin,fit.scale,label,true);

  mainSvg.appendChild(points);
}

const PREFIX="tehnika8.iso.3.",memoryStore=new Map();

}

    if(!validCubes(def.cubes)||!def.cubes.length)throw Error("Razporeditev kock ni veljavna.");
    return {kind:"cubes",title,cubes:copy(def.cubes).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2])};
  }

  const issue=profileProblem(def.profile);

  const ex={kind:"profile",title,profile:normalizeProfile(def.profile),depthMm:def.depthMm,visibleOnly:def.visibleOnly,offsets:{}};
  const dims=dimensionsFor(ex);

function pointerMove(e){
  const svg=e.currentTarget,g=gesture;
  if(g&&(g.id!==e.pointerId||g.svg!==svg))return;
  if(g&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>5)g.moved=true;
  if(g&&route.mode==="orbit"&&svg===refSvg&&g.moved){
    camera.yaw=g.yaw+(e.clientX-g.x)*.009;
    camera.tilt=clamp(g.tilt+(e.clientY-g.y)*.009,-Math.PI,Math.PI);
    if(!hoverFrame)hoverFrame=requestAnimationFrame(()=>{hoverFrame=0;renderDrawReference()});
    return;
  }
  if(g&&route.mode==="editor"&&g.dim&&g.moved&&svg===mainSvg){
    const ex=editorExercise(),d=dimensionsFor(ex).find(v=>v.id===g.dim);
    if(d){const box=svg.getBoundingClientRect(),hori=["top","bottom"].includes(d.dir);
      ex.offsets[d.id]=clamp(g.oldOffset+(hori?(e.clientY-g.y)/box.height:(e.clientX-g.x)/box.width),-1,1);
      g.nextOffset=ex.offsets[d.id];profileDiagram(svg,ex,{editable:true})}
    return;
  }
  if(route.mode==="editor"&&svg===refSvg){if(g||e.pointerType!=="touch")previewEditorEdge(e);return}
  if(e.pointerType==="touch"||svg!==mainSvg)return;
  if(isBuilding()){
    pointBuildTarget(e,g?.remove||false);return;
  }
  if(isDrawing()&&state.drawView==="mine"&&currentDraw().kind!=="circle"&&currentFit){
    const hit=nearestProfilePoint(eventPoint(mainSvg,e),currentFit);
    if(JSON.stringify(hit)===JSON.stringify(state.drawHover))return;
    state.drawHover=hit;
    if(!hoverFrame)hoverFrame=requestAnimationFrame(()=>{hoverFrame=0;renderPencilPreview()});
  }
}
function pointerUp(e){
  const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;
  if(e.currentTarget.hasPointerCapture?.(e.pointerId))e.currentTarget.releasePointerCapture(e.pointerId);
  if(e.type==="pointercancel"){buildHover=null;if(isBuilding())paintHover();if(route.mode==="editor"){refSvg.querySelector(".profile-guide")?.remove();renderEditorPreview()}return}
  if(route.mode==="orbit"&&g.svg===refSvg){drawControls();return}
  if(route.mode==="profile"&&g.svg===refSvg){if(!g.moved)chooseHint(g.target);return}
  if(route.mode==="editor"){
    if(g.svg===refSvg&&(!g.moved||editor.tool==="add"||editor.tool==="move"&&g.vertex!==null))editorTap(e,g.moved?g.vertex:null);
    if(g.svg===mainSvg&&g.dim&&g.nextOffset!==undefined)editProfile(()=>{editor.offsets[g.dim]=g.nextOffset});return;
  }
  if(g.moved||g.svg!==mainSvg)return;
  if(isDrawing())handleDrawingTap(e);
  else if(isBuilding()){
    const target=buildTarget(e,g.remove);
    if(target&&commitCube(target.cell,target.remove)&&e.pointerType!=="touch")pointBuildTarget(e,false);
  }else if(route.mode==="axes")axisAnswer(g.target);
}
for(const svg of [refSvg,mainSvg]){
  svg.addEventListener("pointerdown",pointerDown);svg.addEventListener("pointermove",pointerMove);
  svg.addEventListener("pointerup",pointerUp);svg.addEventListener("pointercancel",pointerUp);
  svg.addEventListener("lostpointercapture",e=>{if(gesture?.id===e.pointerId)cancelGestures()});
}
refSvg.addEventListener("pointerleave",()=>{if(!gesture)refSvg.querySelector(".profile-guide")?.remove()});
mainSvg.addEventListener("contextmenu",e=>{if(isBuilding())e.preventDefault()});
mainSvg.addEventListener("pointerleave",()=>{if(gesture)return;if(isDrawing()&&state.drawHover){state.drawHover=null;renderPencilPreview()}
  if(isBuilding()){buildHover=null;paintHover()}});
document.addEventListener("keydown",e=>{
  if($("panelDialog").open||e.target.closest?.('input,select,textarea,[contenteditable="true"]'))return;
  if(e.key==="Escape"){
    if(refExpanded)flipReference();else if(isDrawing()){clearSelection();render()}return;
  }
  if(isDrawing()&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&state.drawView==="mine"){e.preventDefault();undoStroke();return}
  if(route.mode==="axes"&&["Enter"," "].includes(e.key)&&e.target.closest("[data-choice],[data-map-axis]")){e.preventDefault();axisAnswer(e.target);return}
  if(e.target.closest?.("[data-hint-edge]")&&["Enter"," "].includes(e.key)){
    e.preventDefault();chooseHint(e.target);return;
  }
  if(e.target.closest?.("button"))return;
  if(route.mode==="learn"||route.mode==="axes"&&state.axisMode==="demo"){
    if(["ArrowRight","ArrowLeft"].includes(e.key)){e.preventDefault();act(e.key==="ArrowRight"?"next":"prev")}return;
  }
  if(!isBuilding()||refExpanded||e.ctrlKey||e.metaKey||e.altKey)return;
  const dirs={a:[1,0,0],d:[-1,0,0],w:[0,-1,0],s:[0,1,0],q:[0,0,1],e:[0,0,-1]};
  const dir=dirs[e.key.toLowerCase()];
  if(dir){e.preventDefault();moveBuildCursor(...dir)}
  else if(e.key===" "){
    e.preventDefault();
    if(!e.repeat)commitCube(buildHover?.cell||buildCurrent.cursor,false);
  }
});
window.addEventListener("hashchange",()=>{const r=parseRoute();if(r.mode!==route.mode||r.id!==route.id||r.pose!==route.pose)navigate(r.mode,r.id,r.pose,true)});
window.addEventListener("pagehide",()=>{if(isDrawing())persistAttempt();if(isBuilding())saveBuild()});
let resizeFrame=0;
function resized(){
  if(!started||resizeFrame)return;
  resizeFrame=requestAnimationFrame(()=>{resizeFrame=0;renderSurfaces()});
}
new ResizeObserver(resized).observe($("refSurface"));new ResizeObserver(resized).observe($("workSurface"));
matchMedia("(max-width:760px)").addEventListener("change",()=>{if(started){refExpanded=route.mode==="editor"&&matchMedia("(max-width:760px)").matches;render()}});
function internalSelfCheck(){
  const errors=[];
  if(poses.length!==24||new Set(poses.map(p=>JSON.stringify(p.rows))).size!==24)errors.push("Lege telesa");
  for(const l of lessons)if(!getLessonSteps(l.id).length||l.model&&!validateModel(l.model).ok)errors.push(l.id);
  for(const ex of PROFILE_EXERCISES)if(profileProblem(ex.profile)||ex.depthMm!==30)errors.push(ex.id);
  for(const ex of ASSEMBLE_EXERCISES)if(ex.cubes!==assembleCount(ex.heights)||ex.model&&(!validateModel(ex.model).ok||ex.model.cells.length!==8*ex.cubes))errors.push(ex.id);
  const box=projectedDrawing(getLessonShape("cuboid"));
  if(box.filter(s=>s.expectedLineMode==="hidden").length!==3||CIRCLE_ARC_TARGETS.length!==4||!lessons.every(l=>getLessonSteps(l.id).at(-1)?.title))errors.push("Referenčni primeri");
  return errors;
}
loadDefinitions();restoreEditor();
window.__ISO_SELF_CHECK__=internalSelfCheck();
const initial=parseRoute();navigate(initial.mode,initial.id,initial.pose,true);
if(storageWarning)setFeedback("Lokalno shranjevanje ni na voljo. Risba bo ohranjena v tej seji.");




})();
</script>
